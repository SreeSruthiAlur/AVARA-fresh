name: avara_astrology_trial
description: "AVARA Astrology - Birth Profile & Astrology Evidence System"
publish_to: 'none'
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.3

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_dotenv: ^5.2.1
  http: ^1.6.0
  path: ^1.9.0
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  sweph: ^3.2.1
  flutter_markdown: ^0.7.7+1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/audio/
    - assets/logo.png
