<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="avara_astrology_trial">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>avara_astrology_trial</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Proactively request microphone access on user gesture to avoid Web Speech API permission blocks
    (function() {
      var requested = false;
      function ensureMicrophone() {
        if (requested) return;
        requested = true;
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
              console.log('🎤 [AVARA Web]: Microphone permission successfully granted.');
              // Stop tracks immediately so hardware mic is released for SpeechRecognition
              stream.getTracks().forEach(function(track) { track.stop(); });
            })
            .catch(function(err) {
              console.warn('🎤 [AVARA Web]: Microphone permission not granted yet:', err);
            });
        }
      }
      window.ensureMicrophone = ensureMicrophone;
      window.addEventListener('click', ensureMicrophone, { once: true });
      window.addEventListener('touchstart', ensureMicrophone, { once: true });
    })();

    // =========================================================================
    // AVARA Sacred Vedic Audio & Authentic Chanting Engine
    // (432Hz Harmonic Singing Bowl + Pure Indian Sanskrit Recitation Audio)
    // =========================================================================
    (function() {
      var audioCtx = null;
      var currentChantAudio = null;
      var currentMeaningAudio = null;

      function getAudioContext() {
        if (!audioCtx) {
          var AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Authentic Temple Brass Bell sound for Japa Mala counting
      window.playTempleBell = function() {
        try {
          var ctx = getAudioContext();
          if (ctx) {
            var now = ctx.currentTime;
            var osc = ctx.createOscillator();
            var osc2 = ctx.createOscillator();
            var gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(1760, now); // A6 pure bell
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(3520, now); // A7 harmonic overtone

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);

            osc.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc2.start(now);
            osc.stop(now + 0.9);
            osc2.stop(now + 0.9);
          }
        } catch (e) {
          console.warn("Temple bell audio:", e);
        }
      };

      window.playSacredChant = function(sanskritText, teluguMeaning) {
        console.log("🕉️ [AVARA Audio]: Playing authentic Indian Vedic chant...", sanskritText);
        
        // Stop any currently playing chants
        if (currentChantAudio) {
          try { currentChantAudio.pause(); currentChantAudio.currentTime = 0; } catch(e){}
          currentChantAudio = null;
        }
        if (currentMeaningAudio) {
          try { currentMeaningAudio.pause(); currentMeaningAudio.currentTime = 0; } catch(e){}
          currentMeaningAudio = null;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }

        // 1. Play authentic harmonic Vedic singing bowl chime (108Hz + 216Hz + 432Hz + 528Hz)
        try {
          var ctx = getAudioContext();
          if (ctx) {
            var now = ctx.currentTime;
            var harmonics = [108, 216, 432, 528, 864];
            harmonics.forEach(function(freq, idx) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = idx === 0 ? 'sine' : 'triangle';
              osc.frequency.setValueAtTime(freq, now);
              
              var peakGain = 0.22 / (idx + 1);
              gain.gain.setValueAtTime(0.0001, now);
              gain.gain.linearRampToValueAtTime(peakGain, now + 0.08);
              gain.gain.exponentialRampToValueAtTime(0.00001, now + 5.0);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 5.0);
            });
          }
        } catch (e) {
          console.warn("🕉️ [AVARA Audio Bell]:", e);
        }

        // 2. Select pure authentic Indian Sanskrit audio file
        var chantSrc = 'asato_ma_sanskrit.mp3';
        var query = (sanskritText || '').toLowerCase();
        if (query.indexOf('gayatri') >= 0 || query.indexOf('गायत्री') >= 0 || query.indexOf('bhur') >= 0 || query.indexOf('savitur') >= 0) {
          chantSrc = 'gayatri_mantra.ogg';
        } else if (query.indexOf('tryambakam') >= 0 || query.indexOf('mrityunjaya') >= 0 || query.indexOf('त्र्यम्बकं') >= 0) {
          chantSrc = 'maha_mrityunjaya.mp3';
        }

        try {
          var audio = new Audio(chantSrc);
          currentChantAudio = audio;
          audio.volume = 1.0;

          audio.onended = function() {
            console.log("🕉️ [AVARA Audio]: Sanskrit chant recitation completed.");
            // If Telugu meaning is requested and chant was Asato Ma, play pure native Telugu translation audio
            if (teluguMeaning && chantSrc === 'asato_ma_sanskrit.mp3') {
              var teluguAudio = new Audio('asato_ma_telugu.mp3');
              currentMeaningAudio = teluguAudio;
              teluguAudio.volume = 0.95;
              teluguAudio.play().catch(function(err){ console.warn("Telugu audio error:", err); });
            }
          };

          // Delay 500ms to allow 432Hz singing bowl resonance to blossom first
          setTimeout(function() {
            if (currentChantAudio === audio) {
              audio.play().catch(function(err) {
                console.warn("🕉️ [AVARA Audio]: Direct Audio play error, trying speech fallback", err);
                _speakFallback(sanskritText, teluguMeaning);
              });
            }
          }, 500);
        } catch (err) {
          console.warn("🕉️ [AVARA Audio Play Exception]:", err);
          _speakFallback(sanskritText, teluguMeaning);
        }
      };

      function _speakFallback(sanskritText, teluguMeaning) {
        if ('speechSynthesis' in window) {
          var utter = new SpeechSynthesisUtterance(sanskritText + ". " + (teluguMeaning || ""));
          utter.rate = 0.82;
          utter.pitch = 0.95;
          window.speechSynthesis.speak(utter);
        }
      }

      window.stopSacredChant = function() {
        if (currentChantAudio) {
          try { currentChantAudio.pause(); currentChantAudio.currentTime = 0; } catch(e){}
          currentChantAudio = null;
        }
        if (currentMeaningAudio) {
          try { currentMeaningAudio.pause(); currentMeaningAudio.currentTime = 0; } catch(e){}
          currentMeaningAudio = null;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      };
    })();
  </script>

</body>
</html>
