<body>
  <script>
    // =========================================================================
    // AVARA Native Web Speech Recognition Engine
    // Direct Chrome webkitSpeechRecognition bridge for real-time dictation & actions
    // =========================================================================
    (function() {
      var recognition = null;
      var activeOnResult = null;
      var activeOnEnd = null;
      var activeOnError = null;
      var silenceTimer = null;
      var lastTranscript = '';
      var isExplicitlyStopped = false;
      var sessionStartTime = 0;
      var micPermissionRequested = false;
      var targetLang = 'en-IN';

      window.isWebSpeechAvailable = function() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      };

      function createRecognitionInstance() {
        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) return null;

        var rec = new SpeechRec();
        rec.continuous = true;
        rec.interimResults = true;
        rec.maxAlternatives = 1;
        rec.lang = targetLang;

        rec.onstart = function() {
          console.log('🎤 [AVARA Web Speech]: Microphone listening active in', rec.lang);
        };

        rec.onresult = function(event) {
          var fullTranscript = '';
          var hasFinal = false;

          for (var i = 0; i < event.results.length; i++) {
            var res = event.results[i];
            if (res && res[0] && res[0].transcript) {
              var piece = res[0].transcript.trim();
              if (piece.length > 0) {
                fullTranscript += (fullTranscript.length > 0 ? ' ' : '') + piece;
              }
            }
            if (res && res.isFinal) {
              hasFinal = true;
            }
          }

          fullTranscript = fullTranscript.trim();
          if (fullTranscript.length > 0) {
            lastTranscript = fullTranscript;
            console.log('🎤 [AVARA Web Speech]: Heard words ->', fullTranscript, '(isFinal:', hasFinal, ')');
            if (activeOnResult) {
              // Immediately stream live spoken words to Flutter UI so it types in real-time
              activeOnResult(fullTranscript, false);
            }

            // Auto-finalize action 1600ms after user finishes speaking
            if (silenceTimer) clearTimeout(silenceTimer);
            silenceTimer = setTimeout(function() {
              console.log('🎤 [AVARA Web Speech]: Natural speech pause -> Executing:', lastTranscript);
              if (activeOnResult && lastTranscript.length > 0) {
                activeOnResult(lastTranscript, true);
              }
              window.stopWebSpeechRecognition();
            }, 1600);
          }
        };

        rec.onerror = function(event) {
          console.warn('🎤 [AVARA Web Speech Error]:', event.error);
          if (event.error === 'no-speech' || event.error === 'aborted') {
            // Silence or intentional cancellation — do not trigger error overlay!
            return;
          }
          if (event.error === 'language-not-supported' || event.error === 'network') {
            if (targetLang !== 'en-IN') {
              console.log('🎤 [AVARA Web Speech]: Switching to en-IN locale fallback for broad compatibility');
              targetLang = 'en-IN';
              rec.lang = 'en-IN';
              try { rec.start(); return; } catch(e){}
            }
          }
          if (activeOnError) {
            activeOnError(event.error || 'speech-error');
          }
        };

        rec.onend = function() {
          console.log('🎤 [AVARA Web Speech]: Recognition cycle ended. Explicit:', isExplicitlyStopped);
          if (silenceTimer) {
            clearTimeout(silenceTimer);
            silenceTimer = null;
          }

          // If the user spoke words and session ended, deliver final result!
          if (!isExplicitlyStopped && lastTranscript.length > 0 && activeOnResult) {
            activeOnResult(lastTranscript, true);
            if (activeOnEnd) activeOnEnd();
            return;
          }

          // If user hasn't spoken yet and hasn't explicitly stopped, keep listening for up to 30s!
          var elapsed = Date.now() - sessionStartTime;
          if (!isExplicitlyStopped && elapsed < 30000) {
            console.log('🎤 [AVARA Web Speech]: Idle silence cycle complete. Keeping listening active for user...');
            try {
              rec.start();
              return;
            } catch(e) {
              setTimeout(function() {
                if (!isExplicitlyStopped && (Date.now() - sessionStartTime < 30000)) {
                  try {
                    recognition = createRecognitionInstance();
                    if (recognition) recognition.start();
                  } catch(_) {}
                }
              }, 200);
              return;
            }
          }

          if (activeOnEnd) {
            activeOnEnd();
          }
        };

        return rec;
      }

      window.startWebSpeechRecognition = function(lang, onResult, onEnd, onError) {
        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          console.warn('🎤 [AVARA Web Speech]: SpeechRecognition not available in browser');
          if (onError) onError('browser-not-supported');
          return false;
        }

        try {
          if (recognition) {
            try { recognition.abort(); } catch(e){}
            recognition = null;
          }

          if (silenceTimer) {
            clearTimeout(silenceTimer);
            silenceTimer = null;
          }

          activeOnResult = onResult;
          activeOnEnd = onEnd;
          activeOnError = onError;
          lastTranscript = '';
          isExplicitlyStopped = false;
          sessionStartTime = Date.now();
          targetLang = lang || 'en-IN';

          function doStart() {
            try {
              recognition = createRecognitionInstance();
              if (recognition) {
                recognition.start();
              }
            } catch(startErr) {
              console.error('🎤 [AVARA Web Speech Start Error]:', startErr);
              if (onError) onError(startErr.toString());
            }
          }

          // Prime microphone permissions via getUserMedia if not yet authorized
          if (!micPermissionRequested && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            micPermissionRequested = true;
            navigator.mediaDevices.getUserMedia({ audio: true })
              .then(function(stream) {
                setTimeout(function() {
                  stream.getTracks().forEach(function(t) { t.stop(); });
                }, 1000);
                doStart();
              })
              .catch(function(err) {
                console.warn('🎤 [AVARA getUserMedia Note]:', err);
                doStart();
              });
          } else {
            doStart();
          }

          return true;
        } catch(err) {
          console.error('🎤 [AVARA Web Speech Init Error]:', err);
          if (onError) onError(err.toString());
          return false;
        }
      };

      window.stopWebSpeechRecognition = function() {
        isExplicitlyStopped = true;
        if (silenceTimer) {
          clearTimeout(silenceTimer);
          silenceTimer = null;
        }
        if (recognition) {
          try {
            recognition.stop();
          } catch(e) {}
          recognition = null;
        }
      };
    })();

    // =========================================================================
    // AVARA Sacred Vedic Audio & Authentic Chanting Engine
    // (432Hz Harmonic Singing Bowl + Pure Indian Sanskrit Recitation Audio)
    // =========================================================================
    (function() {
      var audioCtx = null;
      var currentChantAudio = null;
      var currentMeaningAudio = null;

      // Pre-initialize and cache audio elements to prime them in memory
      // asato_ma: Mahakatha peace chant
      // gayatri: Meditativeindia 108 Gayatri Mantra chanting
      // mrityunjaya: Sacred Om Tryambakam chanting
      var chantAudios = {
        'asato_ma': new Audio('asato_ma_sanskrit.m4a'),
        'asato_ma_webm': new Audio('asato_ma_sanskrit.webm'),
        'telugu': new Audio('asato_ma_telugu.mp3'),
        'gayatri': new Audio('gayatri_mantra.m4a'),
        'gayatri_webm': new Audio('gayatri_mantra.webm'),
        'mrityunjaya': new Audio('maha_mrityunjaya.m4a'),
        'mrityunjaya_webm': new Audio('maha_mrityunjaya.webm'),
        'asato_ma_meaning_en': new Audio('asato_ma_meaning_en.mp3'),
        'asato_ma_meaning_te': new Audio('asato_ma_meaning_te.mp3'),
        'gayatri_meaning_en': new Audio('gayatri_meaning_en.mp3'),
        'gayatri_meaning_te': new Audio('gayatri_meaning_te.mp3'),
        'mrityunjaya_meaning_en': new Audio('mrityunjaya_meaning_en.mp3'),
        'mrityunjaya_meaning_te': new Audio('mrityunjaya_meaning_te.mp3'),
        'om_namah_shivaya_meaning_en': new Audio('om_namah_shivaya_meaning_en.mp3'),
        'om_namah_shivaya_meaning_te': new Audio('om_namah_shivaya_meaning_te.mp3'),
        'om_namo_narayanaya_meaning_en': new Audio('om_namo_narayanaya_meaning_en.mp3'),
        'om_namo_narayanaya_meaning_te': new Audio('om_namo_narayanaya_meaning_te.mp3'),
        'asato_ma_meaning_ml': new Audio('asato_ma_meaning_ml.mp3'),
        'gayatri_meaning_ml': new Audio('gayatri_meaning_ml.mp3'),
        'mrityunjaya_meaning_ml': new Audio('mrityunjaya_meaning_ml.mp3'),
        'om_namah_shivaya_meaning_ml': new Audio('om_namah_shivaya_meaning_ml.mp3'),
        'om_namo_narayanaya_meaning_ml': new Audio('om_namo_narayanaya_meaning_ml.mp3')
      };

      for (var k in chantAudios) {
        if (chantAudios.hasOwnProperty(k) && chantAudios[k]) {
          chantAudios[k].preload = 'auto';
        }
      }

      function getAudioContext() {
        if (!audioCtx) {
          var AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Authentic Temple Brass Bell sound for Japa Mala counting
      window.playTempleBell = function() {
        try {
          var ctx = getAudioContext();
          if (ctx) {
            var now = ctx.currentTime;
            var osc = ctx.createOscillator();
            var osc2 = ctx.createOscillator();
            var gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(1760, now); // A6 pure bell
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(3520, now); // A7 harmonic overtone

            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);

            osc.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc2.start(now);
            osc.stop(now + 0.95);
            osc2.stop(now + 0.95);
          }
        } catch (e) {
          console.warn("Temple bell audio:", e);
        }
      };

      window.playSacredChant = function(sanskritText, teluguMeaning) {
        console.log("🕉️ [AVARA Audio]: Playing pure Indian Sanskrit chant...", sanskritText);
        
        // 1. Immediately cancel any speech synthesis or active audio
        window.stopSacredChant();

        // 2. Play authentic harmonic Vedic singing bowl chime (108Hz + 216Hz + 432Hz + 528Hz)
        try {
          var ctx = getAudioContext();
          if (ctx) {
            var now = ctx.currentTime;
            var harmonics = [108, 216, 432, 528, 864];
            harmonics.forEach(function(freq, idx) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = idx === 0 ? 'sine' : 'triangle';
              osc.frequency.setValueAtTime(freq, now);
              
              var peakGain = 0.22 / (idx + 1);
              gain.gain.setValueAtTime(0.0001, now);
              gain.gain.linearRampToValueAtTime(peakGain, now + 0.08);
              gain.gain.exponentialRampToValueAtTime(0.00001, now + 4.5);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 4.5);
            });
          }
        } catch (e) {
          console.warn("🕉️ [AVARA Audio Bell]:", e);
        }

        // 3. Select pure authentic Indian Sanskrit audio file
        var query = (sanskritText || '').toLowerCase();
        var audioKey = 'asato_ma';
        if (query.indexOf('gayatri') >= 0 || query.indexOf('गायत्री') >= 0 || query.indexOf('bhur') >= 0 || query.indexOf('savitur') >= 0) {
          audioKey = 'gayatri';
        } else if (query.indexOf('tryambakam') >= 0 || query.indexOf('mrityunjaya') >= 0 || query.indexOf('त्र्यम्बकं') >= 0) {
          audioKey = 'mrityunjaya';
        }

        try {
          var audio = chantAudios[audioKey];
          if (!audio) {
            var src = audioKey === 'gayatri' ? 'gayatri_mantra.m4a' : (audioKey === 'mrityunjaya' ? 'maha_mrityunjaya.m4a' : 'asato_ma_sanskrit.m4a');
            audio = new Audio(src);
            chantAudios[audioKey] = audio;
          }

          currentChantAudio = audio;
          audio.currentTime = 0;
          audio.volume = 1.0;

          audio.onended = function() {
            console.log("🕉️ [AVARA Audio]: Sanskrit chant recitation completed.");
          };

          // 4. CRITICAL: Call audio.play() SYNCHRONOUSLY directly inside the user's gesture!
          // NEVER use setTimeout and NEVER use English speechSynthesis fallback!
          var playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.then(function() {
              console.log("🕉️ [AVARA Audio]: Real Indian Sanskrit chanting is playing!");
            }).catch(function(err) {
              console.error("🕉️ [AVARA Audio Direct Play Error]:", err);
            });
          }
        } catch (err) {
          console.error("🕉️ [AVARA Audio Play Exception]:", err);
        }
      };

      window.playTranslationAudio = function(mantraKey, langCode) {
        console.log("🕉️ [AVARA Audio]: Playing spoken translation...", mantraKey, langCode);
        window.stopSacredChant();

        var langSuffix = 'en';
        if (langCode === 'te' || langCode === 'tanglish') {
          langSuffix = 'te';
        } else if (langCode === 'ml' || langCode === 'manglish') {
          langSuffix = 'ml';
        }
        var key = (mantraKey || 'asato_ma') + '_meaning_' + langSuffix;
        var audio = chantAudios[key];
        if (!audio) {
          audio = new Audio(key + '.mp3');
          chantAudios[key] = audio;
        }

        try {
          currentMeaningAudio = audio;
          audio.currentTime = 0;
          audio.volume = 1.0;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function() {
              console.log("🕉️ [AVARA Audio]: Spoken translation is playing in", langCode, "as", key);
            }).catch(function(err) {
              console.warn("Translation audio error:", err);
            });
          }
        } catch (e) {
          console.error("Translation audio exception:", e);
        }
      };

      var currentDynamicTts = null;
      window.playDynamicTts = function(text, langCode) {
        window.stopSacredChant();
        try {
          if (currentDynamicTts) {
            try { currentDynamicTts.pause(); } catch(e){}
            currentDynamicTts = null;
          }
          var encoded = encodeURIComponent(text);
          var effective = (langCode === 'manglish' || langCode === 'ml') ? 'ml' : (langCode === 'tanglish' ? 'te' : langCode);
          var url = 'http://127.0.0.1:8000/api/v1/tts/synthesize?text=' + encoded + '&lang=' + (effective || 'ml');
          var audio = new Audio(url);
          currentDynamicTts = audio;
          audio.volume = 1.0;
          audio.play().then(function() {
            console.log("🔊 [AVARA Dynamic Neural TTS]: Playing pure native voice in", langCode);
          }).catch(function(err) {
            console.warn("Dynamic TTS network audio error:", err);
            if ('speechSynthesis' in window) {
              var utt = new SpeechSynthesisUtterance(text);
              utt.lang = (langCode === 'te' || langCode === 'tanglish') ? 'te-IN' : (langCode === 'ml' ? 'ml-IN' : 'en-IN');
              window.speechSynthesis.speak(utt);
            }
          });
        } catch(e) {
          console.error("Dynamic TTS exception:", e);
        }
      };

      window.stopSacredChant = function() {
        if (currentDynamicTts) {
          try {
            currentDynamicTts.pause();
            currentDynamicTts.currentTime = 0;
          } catch(e){}
          currentDynamicTts = null;
        }
        if (currentChantAudio) {
          try {
            currentChantAudio.pause();
            currentChantAudio.currentTime = 0;
          } catch(e){}
          currentChantAudio = null;
        }
        if (currentMeaningAudio) {
          try {
            currentMeaningAudio.pause();
            currentMeaningAudio.currentTime = 0;
          } catch(e){}
          currentMeaningAudio = null;
        }
        for (var k in chantAudios) {
          if (chantAudios.hasOwnProperty(k) && chantAudios[k]) {
            try {
              chantAudios[k].pause();
              chantAudios[k].currentTime = 0;
            } catch(e){}
          }
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      };
    })();
  </script>

</body>
</html>
